name: Required reviewers

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  checks: write
  contents: read
  pull-requests: read

jobs:
  evaluate:
    name: Evaluate dual approval
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate current reviews and publish the HEAD check
        uses: actions/github-script@v8
        with:
          script: |
            const pull = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headSha = pull.head.sha;
            const maintainers = ['jonc0der', 'jiraiya972'];
            const author = pull.user.login.toLowerCase();
            const required = maintainers.filter((login) => login !== author);

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number: pull.number,
              per_page: 100,
            });

            const latest = new Map();
            for (const review of reviews) {
              const login = review.user?.login?.toLowerCase();
              if (!login || review.commit_id !== headSha) continue;
              const previous = latest.get(login);
              if (!previous || new Date(review.submitted_at) > new Date(previous.submitted_at)) {
                latest.set(login, review);
              }
            }

            const changeRequests = [...latest.values()]
              .filter((review) => review.state === 'CHANGES_REQUESTED')
              .map((review) => review.user.login);
            const missing = required.filter((login) => latest.get(login)?.state !== 'APPROVED');
            const success = missing.length === 0 && changeRequests.length === 0;
            const summary = success
              ? 'Le consentement requis est présent sur le HEAD SHA courant.'
              : `Approbations manquantes: ${missing.join(', ') || 'aucune'}. Demandes de changements actives: ${changeRequests.join(', ') || 'aucune'}.`;

            await github.rest.checks.create({
              owner,
              repo,
              name: 'governance/dual-approval',
              head_sha: headSha,
              status: 'completed',
              conclusion: success ? 'success' : 'failure',
              output: {
                title: success ? 'Double consentement validé' : 'Double consentement requis',
                summary,
              },
            });

