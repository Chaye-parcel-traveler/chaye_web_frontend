name: Docker

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    env:
      # Keep the scanner digest current via issue #40; the fixture stays vulnerable for this regression check.
      TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
      VULNERABLE_IMAGE: nginx:1.30.3-alpine@sha256:0d3b80406a13a767339fbe2f41406d6c7da727ab89cf8fae399e81f780f814d1
    steps:
      - name: Checkout frontend
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build production image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: false
          load: true
          target: production
          tags: chaye-web-frontend:ci
          build-args: |
            VITE_API_URL=http://localhost:3333
            VITE_API_ASSETS_URL=http://localhost:3333
            VITE_APP_ENV=production
            VITE_PUBLIC_ASSETS_URL=/
          cache-from: type=gha,scope=chaye-frontend-production
          cache-to: type=gha,mode=max,scope=chaye-frontend-production

      - name: Verify Trivy rejects a vulnerable image
        run: |
          docker volume create trivy-cache
          docker pull "$VULNERABLE_IMAGE"
          if docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume trivy-cache:/root/.cache \
            "$TRIVY_IMAGE" image --image-src docker --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json "$VULNERABLE_IMAGE" > vulnerable-image-report.json; then
            echo "::error::Trivy accepted the known vulnerable test image."
            exit 1
          fi
          python3 -c 'import json; report=json.load(open("vulnerable-image-report.json")); hits=[v for result in report.get("Results", []) for v in result.get("Vulnerabilities", []) if v.get("Severity") in {"HIGH", "CRITICAL"}]; assert hits, "Trivy failed without reporting HIGH or CRITICAL vulnerabilities"'

      - name: Scan production image
        run: >-
          docker run --rm
          --volume /var/run/docker.sock:/var/run/docker.sock
          --volume trivy-cache:/root/.cache
          "$TRIVY_IMAGE" image --image-src docker --scanners vuln --severity HIGH,CRITICAL
          --exit-code 1 chaye-web-frontend:ci

      - name: Verify production HTTP headers and cache
        run: bash scripts/smoke-production.sh chaye-web-frontend:ci http://localhost:3333

      - name: Build E2E image with cached Playwright browsers
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: false
          target: e2e
          tags: chaye-web-frontend-e2e:ci
          cache-from: type=gha,scope=chaye-frontend-e2e
          cache-to: type=gha,mode=max,scope=chaye-frontend-e2e
